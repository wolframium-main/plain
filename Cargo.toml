[package]
name = "plain"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A browser that does exactly what you tell it"
repository = "https://github.com/wolframium-main/plain"

[dependencies]
gtk = { version = "0.10", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
webkit6 = "0.5"

[profile.release]
lto = "thin"
